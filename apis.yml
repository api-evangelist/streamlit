apis:
- aid: streamlit:streamlit-python-api
  name: Streamlit Python API
  description: >-
    The Streamlit Python library API provides a rich set of functions for building interactive data applications.
    Organized by activity type: display data (st.write, st.dataframe, st.table), input widgets (st.button,
    st.slider, st.selectbox), layout (st.columns, st.tabs, st.sidebar), media (st.image, st.video, st.audio),
    charts (st.line_chart, st.bar_chart, st.map), and performance (st.cache_data, st.cache_resource).
    Also includes connection management via st.connection.
  humanURL: https://docs.streamlit.io/develop/api-reference
  tags:
  - Data Science
  - Machine Learning
  - Open Source
  - Python
  - Web Applications
