naftiko: 1.0.0-alpha2
info:
  label: Streamlit Community Cloud API — Apps
  description: 'Streamlit Community Cloud API — Apps. 5 operations. Lead operation: List Apps. Self-contained Naftiko capability
    covering one Streamlit business surface.'
  tags:
  - Streamlit
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STREAMLIT_API_KEY: STREAMLIT_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-apps
    baseUri: https://api.streamlit.io/v1
    description: Streamlit Community Cloud API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: apps
      path: /apps
      operations:
      - name: listapps
        method: GET
        description: List Apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
        - name: per_page
          in: query
          type: integer
          description: Number of apps per page
      - name: deployapp
        method: POST
        description: Deploy App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apps-appId
      path: /apps/{appId}
      operations:
      - name: getapp
        method: GET
        description: Get App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteapp
        method: DELETE
        description: Delete App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appId-restart
      path: /apps/{appId}/restart
      operations:
      - name: restartapp
        method: POST
        description: Restart App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.STREAMLIT_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-apps-rest
    port: 8080
    description: REST adapter for Streamlit Community Cloud API — Apps. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apps
      name: apps
      description: REST surface for apps.
      operations:
      - method: GET
        name: listapps
        description: List Apps
        call: cloud-apps.listapps
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: deployapp
        description: Deploy App
        call: cloud-apps.deployapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{appid}
      name: apps-appid
      description: REST surface for apps-appId.
      operations:
      - method: GET
        name: getapp
        description: Get App
        call: cloud-apps.getapp
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapp
        description: Delete App
        call: cloud-apps.deleteapp
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{appid}/restart
      name: apps-appid-restart
      description: REST surface for apps-appId-restart.
      operations:
      - method: POST
        name: restartapp
        description: Restart App
        call: cloud-apps.restartapp
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Streamlit Community Cloud API — Apps. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-apps
      description: List Apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-apps.listapps
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: deploy-app
      description: Deploy App
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-apps.deployapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-app
      description: Get App
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-apps.getapp
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-app
      description: Delete App
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-apps.deleteapp
      outputParameters:
      - type: object
        mapping: $.
    - name: restart-app
      description: Restart App
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-apps.restartapp
      outputParameters:
      - type: object
        mapping: $.
